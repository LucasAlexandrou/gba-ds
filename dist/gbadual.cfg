# gbadual settings. Every option can also be given on the command line
# (e.g. --swap, --map-interval=60). Lines starting with # are ignored.

# Screen arrangement. auto = detect. span-h / span-v = one window covering
# both screens side by side / stacked. dual = one window per display.
# single = one screen; L2 flips between game and map.
layout = auto

# Show the map on the first screen and the game on the second.
# If the game comes up on the wrong physical screen, flip this (or press L2).
swap = 0

# Scaling: integer (sharp, 4x on the RG DS Plus), fit, or stretch.
scale = integer
map_scale = integer
smooth = 0
vsync = 0

# Map refresh. The map also refreshes right after every room transition.
map = 1
map_interval = 90

# Buttons. By default GBA A is the right face button and GBA B the bottom one,
# like a GBA. Set ab_swap = 1 to flip them.
ab_swap = 0

# Hotkey modifier: guide (the function/home button) or back (Select).
hotkey = guide

show_fps = 0
audio_latency = 64
ff_speed = 3

# Where battery saves (.sav) and save states go. Empty = next to the ROM.
# On first run an existing RetroArch .srm save is copied to .sav.
save_dir =
