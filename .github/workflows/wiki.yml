# Publishes wiki/ to the GitHub wiki whenever it changes on main.
# (The wiki must already exist: create its first page once in the browser.)
name: Wiki

on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push wiki/ to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          rsync -a --delete --exclude .git wiki/ wiki-repo/
          cd wiki-repo
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update from ${GITHUB_SHA::7}"
          git push
